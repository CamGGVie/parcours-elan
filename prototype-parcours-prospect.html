<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype – Demande d’adhésion solution épargne (parcours prospect)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&display=swap" rel="stylesheet">
<style>/* ===== Tokens (repris des variables Figma du fichier) ===== */
:root{
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --brand:#006a53;            /* color/base-brand, color/text/brand */
  --accent:#007f6e;           /* accent (texte sélectionné) */
  --accent-border:#01ac9e;    /* color/border/accent, base-accent */
  --accent-light:#e6f9f5;     /* base-accent-light / success-light */
  --success:#007e5a;
  --success-icon:#2cbb9c;     /* base-success */
  --primary:#ff7b00;          /* control-primary */
  --primary-hover:#e66f00;    /* dérivé (non présent dans les maquettes) */
  --primary-press:#cc6200;    /* dérivé */
  --text:#222222;
  --text-light:#757980;       /* default-light */
  --border:#b2b2b2;           /* default */
  --white:#ffffff;
  --bg-secondary:#f5f5f5;
  --bg-tertiary:#efefef;
  --page:#efefef;
  --danger:#ba2f31;
  --danger-icon:#d85050;
  --error-text:#d3373a;
  --warning:#c14a00;
  --warning-light:#fff3e6;
  --info-bg:#e6f7fc;
  --info-title:#0f6ea8;
  --link:#004691;             /* old-color/link/default */
  --radius-c:4px;             /* border-radius/component */
  --radius-b:8px;             /* border-radius/base */
  --shadow-1:0 3px 8px -1px rgba(0,0,0,.10),0 0 1px 0 rgba(0,0,0,.30);
  --focus:0 0 0 2px #fff,0 0 0 4px #222;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--page);font-size:16px;line-height:22px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
p{margin:0}
h1,h2,h3,h4{margin:0;font-weight:600}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:4px}

/* ===== Icônes (PNG en masque pour hériter de la couleur) ===== */
.ico{display:inline-block;flex:none;background-color:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.img{display:block;flex:none}

/* ===== En-tête tunnel ===== */
.hdr{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);position:relative;z-index:5}
.hdr__in{height:56px;max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.wide .hdr__in{max-width:1004px}
.hdr__logo{height:56px;width:auto}
.hdr__logo--m{display:none}
.btn-help{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--primary);border-radius:var(--radius-c);background:#fff;color:var(--primary);font-weight:600;cursor:pointer}
.btn-help:hover{background:var(--warning-light)}

/* ===== Mise en page ===== */
.page{padding:24px 0 0}
.layout{max-width:680px;margin:0 auto;display:flex;gap:24px;align-items:flex-start}
.wide .layout{max-width:1004px}
.card{background:#fff;border-radius:var(--radius-b);padding:32px;width:680px;max-width:100%;flex:none}
.side{width:300px;display:flex;flex-direction:column;gap:24px;flex:none}
.side .card{width:100%;padding:24px}
.stack{display:flex;flex-direction:column;gap:24px}
.stack-16{display:flex;flex-direction:column;gap:16px}
.stack-12{display:flex;flex-direction:column;gap:12px}
.stack-8{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px}

/* Stepper */
.stepper{display:flex;flex-direction:column;gap:8px}
.stepper__t{font-size:16px;line-height:22px;font-weight:600}
.stepper__bar{height:8px;border-radius:8px;background:var(--bg-secondary);overflow:hidden}
.stepper__fill{height:100%;min-width:12px;border-radius:8px;background:var(--brand);transition:width .4s ease}

.h2{font-size:24px;line-height:32px;font-weight:600}
.h3{font-size:20px;line-height:24px;font-weight:600}
.h4{font-size:18px;line-height:22px;font-weight:600}
.lead-green{color:var(--brand)}
.t-sm{font-size:14px;line-height:20px}
.t-xs{font-size:12px;line-height:16px}
.t-light{color:var(--text-light)}
.t-semi{font-weight:600}

/* Pied de carte */
.actions{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:8px}
.actions--end{justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 12px;border-radius:var(--radius-c);border:0;font-weight:600;line-height:22px;cursor:pointer;text-align:center;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:active{background:var(--primary-press)}
.btn-primary[disabled]{opacity:.4;cursor:not-allowed}
.btn-back{background:none;color:var(--text);padding:8px 4px}
.btn-back:hover{text-decoration:underline}
.btn-tertiary{background:var(--bg-tertiary);color:var(--text)}
.btn-tertiary:hover{background:#e2e2e2}
.btn-white{background:#fff;color:var(--text)}
.btn-white:hover{background:var(--bg-tertiary)}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-outline:hover{background:var(--warning-light)}
.btn.loading{position:relative;color:transparent!important}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.link{color:var(--link);text-decoration:underline;font-weight:600;background:none;border:0;padding:0;cursor:pointer;font-size:inherit}
.link:hover{color:var(--primary)}
.link-brand{color:var(--brand);text-decoration:underline;font-weight:600;background:none;border:0;padding:0;cursor:pointer}

/* ===== Champs ===== */
.field{display:flex;flex-direction:column;gap:12px;border:0;margin:0;padding:0;min-width:0}
.field__head{display:flex;flex-direction:column}
.field__labelrow{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.field__label{font-weight:600;font-size:16px;line-height:22px;padding:0}
.field__desc{font-size:14px;line-height:20px;color:var(--text-light)}
.field__opt{color:var(--text-light);font-weight:400}
.field__grp{display:flex;flex-direction:column;gap:8px}
.inp-wrap{position:relative;width:300px;max-width:100%}
.inp-wrap.full{width:100%}
.inp{width:100%;height:40px;border:1px solid var(--border);border-radius:var(--radius-c);background:#fff;padding:9px 40px 9px 14px;font-size:16px;line-height:22px;font-weight:600;color:var(--text)}
.inp::placeholder{color:var(--text-light);font-weight:400}
.inp:hover{border-color:#8a8a8a}
.inp:focus,.inp:focus-visible{outline:none;border-color:var(--text);box-shadow:0 0 0 1px var(--text);border-radius:var(--radius-c)}
.inp[aria-invalid=true]:focus{box-shadow:none}
.inp[aria-invalid=true]{border:2px solid var(--error-text);padding-left:13px}
.inp:disabled{background:var(--bg-secondary);color:var(--text-light)}
.inp--icon-l{padding-left:38px}
.inp-pre{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-light);pointer-events:none}
.inp-suffix{position:absolute;top:50%;transform:translateY(-50%);font-weight:600;pointer-events:none}
.inp-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:none;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text)}
.inp-clear:hover{background:var(--bg-tertiary)}
.inp-cal{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text)}
.inp-wrap.has-cal .inp-clear{right:34px}
.inp-wrap.has-cal .inp{padding-right:64px}
.err{display:flex;gap:8px;align-items:flex-start;color:var(--error-text);font-weight:600;font-size:14px;line-height:20px}
.err .img{margin-top:0}
.err--lg{font-size:16px;line-height:22px}
.err-box{background:#fdeeee;border-radius:var(--radius-c);padding:12px 16px;color:var(--error-text);font-size:14px;line-height:20px}
.err-box p+p{margin-top:12px}
.err-box .head{display:flex;gap:8px;font-weight:600}

/* Select (liste déroulante custom accessible) */
.dd{position:relative;width:300px;max-width:100%}
.dd__btn{width:100%;height:40px;display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:var(--radius-c);background:#fff;padding:9px 10px 9px 14px;cursor:pointer;text-align:left}
.dd__btn:hover{border-color:#8a8a8a}
.dd__btn:focus-visible,.dd__btn[aria-expanded=true]{outline:none;border-color:var(--text);box-shadow:0 0 0 1px var(--text);border-radius:var(--radius-c)}
.dd__btn[aria-invalid=true]:focus-visible{box-shadow:none;border-color:var(--error-text)}
.dd__btn[aria-invalid=true]{border:2px solid var(--error-text);padding-left:13px}
.dd__val{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.dd__val.ph{color:var(--text-light);font-weight:400}
.dd__list{position:absolute;z-index:20;left:0;right:0;top:44px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-c);box-shadow:var(--shadow-1);max-height:320px;overflow:auto;margin:0;padding:0;list-style:none}
.dd__opt{padding:10px 14px;font-weight:600;cursor:pointer;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd__opt:hover,.dd__opt.active{background:var(--accent-light)}
.dd__opt[aria-selected=true]{color:var(--accent)}

/* Radios « boutons » */
.choices{display:grid;gap:12px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-1{grid-template-columns:1fr}
.choices-hug .choices{grid-template-columns:auto auto 1fr}
.choices-hug .rb__label{white-space:nowrap}
.rb{position:relative;display:flex}
.rb input{position:absolute;opacity:0;width:1px;height:1px}
.rb__box{flex:1;display:flex;gap:5px;align-items:flex-start;padding:9px 14px 9px 10px;border:1px solid var(--border);border-radius:var(--radius-c);background:#fff;cursor:pointer;font-weight:600;line-height:22px;min-height:40px}
.rb__box:hover{border-color:#8a8a8a;background:#fafafa}
.rb input:focus-visible+.rb__box{box-shadow:var(--focus)}
.rb input:checked+.rb__box{background:var(--accent-light);border:2px solid var(--accent-border);padding:8px 13px 8px 9px;color:var(--accent)}
.rb input:disabled+.rb__box{opacity:.33;cursor:default;background:#fff}
.radio{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center}
.radio::before{content:"";width:16.5px;height:16.5px;border:1px solid var(--text);border-radius:50%;background:#fff;box-sizing:border-box}
.rb input:checked+.rb__box .radio::before,.radio.on::before{border:5px solid var(--accent);background:#fff;box-shadow:inset 0 0 0 2px #fff}
.rb__label{flex:1}
/* Tuiles avec icône */
.tile .rb__box{flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px 12px;min-height:98px;text-align:center}
.tile input:checked+.rb__box{padding:13px 11px}
.tile .radio{position:absolute;left:8px;top:8px}
.tile .ico{width:48px;height:48px}
.tile--obj .rb__box{min-height:112px}
.tile--obj .ico{width:40px;height:40px}
/* Cartes de choix (clause, déduction, gestion) */
.ccard{position:relative}
.ccard input{position:absolute;opacity:0;width:1px;height:1px}
.ccard__box{display:block;border:1px solid var(--border);border-radius:var(--radius-c);background:#fff;padding:12px;cursor:pointer}
.ccard__box:hover{border-color:#8a8a8a}
.ccard input:focus-visible+.ccard__box{box-shadow:var(--focus)}
.ccard input:checked+.ccard__box{border:2px solid var(--accent-border);padding:11px}
.ccard--reco .ccard__box{border-color:var(--primary)}
.ccard__head{display:flex;gap:8px;align-items:center}
.ccard__titles{flex:1;display:flex;flex-direction:column}
.ccard input:checked+.ccard__box .ccard__titles,.ccard input:checked+.ccard__box .ccard__t{color:var(--accent)}
.ccard__t{font-weight:600}
.ccard__more{margin-top:12px;background:var(--accent-light);border-radius:var(--radius-c);padding:12px 16px}
.ccard__pic{width:40px;height:40px;border-radius:8px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ccard__pic .ico{width:24px;height:24px}
/* Checkbox */
.cb{display:flex;gap:5px;align-items:flex-start;cursor:pointer;position:relative}
.cb input{position:absolute;opacity:0;width:1px;height:1px}
.cb__box{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center}
.cb__box::before{content:"";width:16.5px;height:16.5px;border:1px solid var(--text);border-radius:4px;background:#fff;box-sizing:border-box}
.cb input:checked+.cb__box::before{background:var(--accent);border-color:var(--accent)}
.cb input:checked+.cb__box::after{content:"";position:absolute;left:7px;top:4px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cb input:focus-visible+.cb__box{box-shadow:var(--focus);border-radius:4px}
.cb input:checked~.cb__label{color:var(--accent)}
.cb__label{flex:1;line-height:24px}
.cb-btn{border:1px solid var(--border);border-radius:var(--radius-c);padding:8px 14px 8px 10px;font-weight:600;line-height:22px}
.cb-btn:has(input:checked){border:2px solid var(--accent-border);background:var(--accent-light);padding:7px 13px 7px 9px}

/* ===== Messages ===== */
.msg{display:flex;gap:8px;padding:16px;border-radius:var(--radius-c);align-items:flex-start}
.msg__body{flex:1;display:flex;flex-direction:column;gap:4px}
.msg--info{background:var(--info-bg)}
.msg--info .msg__t{color:var(--info-title);font-weight:600}
.msg--success{background:var(--accent-light);color:var(--success);font-weight:600}
.msg--accent{background:var(--accent-light);color:var(--accent)}
.msg--warn{background:var(--warning-light)}
.msg--warn .msg__t{color:var(--warning);font-weight:600}
.msg--neutral{background:var(--bg-secondary)}
.msg ul{margin:0;padding-left:18px}
.msg .img{margin-top:-1px}

/* Bannière offre */
.offer{display:flex;gap:16px;align-items:center;background:var(--warning-light);padding:24px;border-radius:var(--radius-c)}
.offer__t{color:var(--warning);font-size:20px;line-height:26px;font-weight:600}

/* Carte connexion */
.connect{display:flex;gap:16px;align-items:center;background:var(--accent-light);padding:16px;border-radius:var(--radius-c)}
.connect__t{color:var(--brand);font-weight:600}

/* ===== Écrans intermédiaires ===== */
.middle{display:flex;gap:16px;align-items:center}
.middle__txt{flex:1;display:flex;flex-direction:column;gap:4px}
.middle__t{color:var(--brand);font-size:20px;line-height:26px;font-weight:600}

/* Onboarding */
.onb-list{display:flex;flex-direction:column;gap:16px;flex:1}
.onb-item{display:flex;gap:12px;align-items:center}
.onb-item .pic{width:40px;height:40px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;flex:none}

/* Loader */
.loader{min-height:256px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-weight:600}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--brand);animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:scale(1)}50%{transform:scale(1.45)}}
@media (prefers-reduced-motion:reduce){.dots i,.btn.loading::after,.stepper__fill{animation:none;transition:none}}

/* ===== Projection ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.need{display:flex;gap:4px;align-items:center;background:var(--bg-secondary);border-radius:var(--radius-c);padding:8px}
.need .ico{width:40px;height:40px}
.need__l{font-size:14px;line-height:20px}
.need__v{font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:6px 10px;font-size:14px;line-height:20px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--accent-border);border-bottom-color:var(--accent-border)}
.tab:hover{color:var(--accent)}
.vals{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:16px}
.val{background:var(--bg-secondary);border-radius:var(--radius-c);padding:12px;display:flex;flex-direction:column;gap:4px}
.val__l{font-size:14px;line-height:20px}
.val__v{font-size:20px;line-height:26px;font-weight:600;color:var(--accent)}
.val__s{font-size:12px;line-height:16px;color:var(--text-light)}
.repart{background:var(--bg-secondary);border-radius:var(--radius-c);padding:16px;display:flex;flex-direction:column;gap:12px}
.repart__h{display:flex;align-items:center;gap:12px}
.tag{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--border);background:#fff;border-radius:var(--radius-c);padding:4px 5px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
.tag--md{font-size:14px;line-height:20px;padding:3px 6px}
.tag--success{background:var(--accent-light);border-color:transparent;color:var(--success)}
.tag--success-fill{background:var(--success-icon);border-color:transparent;color:#fff}
.tag--warn{background:var(--warning-light);border-color:transparent;color:var(--warning)}
.tag--plain{background:#fff;border:1px solid var(--border)}
.bar{height:8px;display:flex;border-radius:8px;overflow:hidden;gap:0}
.bar span{height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--text-light);font-size:14px;line-height:20px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:8px;margin-right:8px;vertical-align:-1px}
.speak{display:flex;gap:16px;align-items:center;background:var(--accent-light);padding:16px;border-radius:var(--radius-c)}
.mobile-only{display:none}

/* ===== QCC ===== */
.qcc{background:var(--bg-secondary);border-radius:var(--radius-c);padding:12px;display:flex;flex-direction:column;gap:12px}
.qcc__item{background:#fff;border-radius:var(--radius-c);padding:12px;display:flex;gap:12px;align-items:center}
.qcc__pic{width:40px;height:40px;border-radius:4px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;flex:none}
.qcc__t{font-weight:600}
.qcc__s{color:var(--text-light)}
.answer{display:flex;gap:12px;padding:16px;border-radius:var(--radius-b);background:var(--bg-secondary)}
.answer__pic{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.answer__t{font-weight:600}
.answer--ok .answer__t{color:var(--brand)}
.answer--ko .answer__t{color:var(--danger)}
.esg{display:flex;gap:16px;align-items:center;background:var(--accent-light);padding:24px;border-radius:var(--radius-c)}
.esg__t{color:var(--brand);font-size:20px;line-height:26px;font-weight:600}

/* Résultat profil */
.result-list{background:var(--bg-secondary);border-radius:var(--radius-b);padding:12px;display:flex;flex-direction:column;gap:12px}
.result-item{background:#fff;border-radius:var(--radius-b);padding:12px;display:flex;gap:12px;align-items:center}
.result-item .qcc__pic{width:32px;height:32px}

/* ===== Solution ===== */
.prod-head{display:flex;gap:16px;align-items:flex-start}
.prod-name{color:var(--brand);font-size:24px;line-height:32px;font-weight:600}
.reasons{display:flex;flex-direction:column}
.reason{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid #d9d9d9}
.reason:last-child{border-bottom:0}
.reason__pic{width:32px;height:32px;border-radius:4px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.reason__t{font-weight:600}
.reason__d{color:var(--text-light)}
.doc-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg-secondary);padding:10px 10px 10px 10px;border-radius:var(--radius-c);font-weight:600}
.side-item{display:flex;gap:8px;background:var(--bg-secondary);border-radius:var(--radius-c);padding:10px 12px}
.side-item .ico{color:var(--brand);width:20px;height:20px;margin-top:1px}
.side-t{color:var(--brand);font-size:18px;line-height:22px;font-weight:600}

/* Profil de gestion */
.gbox{background:var(--bg-secondary);border-radius:var(--radius-b);padding:20px;display:flex;gap:12px}
.gbox--green{background:var(--accent-light)}
.gbox__pic{width:36px;height:36px;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.gbox__body{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.gbox__t{font-weight:600}
.alloc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alloc__c{background:#fff;border-radius:var(--radius-c);padding:8px;display:flex;justify-content:space-between;align-items:center}
.alloc__v{font-size:20px;line-height:26px;font-weight:600}
.alloc__l{font-size:14px;line-height:20px;color:var(--text-light)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feat div{background:#fff;border-radius:var(--radius-c);padding:12px;display:flex;gap:8px}
.fees{font-size:14px;line-height:20px}
.fees p:first-child{font-weight:600;margin-bottom:4px}

/* Sélection profil (modif préco) */
.pcards{display:grid;gap:12px;grid-template-columns:repeat(var(--n,5),1fr)}
.pcard{position:relative;display:flex}
.pcard input{position:absolute;opacity:0;width:1px;height:1px}
.pcard__box{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;border:1px solid var(--border);border-radius:var(--radius-c);background:#fff;padding:32px 12px 12px;cursor:pointer;min-width:0}
.pcard__box:hover{border-color:#8a8a8a}
.pcard--reco .pcard__box{border-color:var(--primary)}
.pcard input:checked+.pcard__box{border:2px solid var(--accent-border);background:var(--accent-light);padding:31px 11px 11px;color:var(--accent)}
.pcard input:focus-visible+.pcard__box{box-shadow:var(--focus)}
.pcard .radio{position:absolute;left:7px;top:7px}
.pcard .tag{position:absolute;right:6px;top:7px}
.pcard .ico{width:40px;height:40px}
.pcard__t{font-weight:600;line-height:24px}
.pcard__d{font-size:14px;line-height:20px}

/* Upload */
.upl{border:1px solid var(--border);border-radius:var(--radius-c);padding:16px;display:flex;flex-direction:column;gap:12px}
.upl__head{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.upl__t{font-weight:600}
.upl__d{color:var(--text-light)}
.prog{height:8px;border-radius:8px;background:var(--bg-tertiary);overflow:hidden}
.prog span{display:block;height:100%;background:#1a8fd2;width:0;transition:width 1.4s ease-out}
.file{display:flex;gap:8px;align-items:center}
.file__n{flex:1;text-decoration:underline;font-weight:600}
.file__s{color:var(--text-light)}

/* Récap */
.acc{background:var(--bg-secondary);border-radius:var(--radius-b);padding:16px}
.acc__btn{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:0;cursor:pointer;text-align:left;font-size:20px;line-height:26px;font-weight:600}
.acc__ic{width:36px;height:36px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center}
.acc__body{border-top:1px solid #8a8a8a;margin-top:16px;padding-top:12px}
.kv{display:grid;grid-template-columns:208px 1fr;gap:0 16px}
.kv dt,.kv dd{margin:0;padding:4px 0;border-bottom:1px solid #d9d9d9;line-height:22px}
.kv dt{font-weight:600}
.kv .sep{grid-column:1/-1;height:12px}
.kv dt.last,.kv dd.last{border-bottom:0}

/* Validation */
.vstep{border:1px solid var(--border);border-radius:var(--radius-b);padding:16px;display:flex;flex-direction:column;gap:16px}
.vstep__h{display:flex;gap:12px;align-items:flex-start}
.vstep__pic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.vstep__t{font-weight:600}
.vstep__d{color:var(--text-light)}
.grey-box{background:var(--bg-secondary);border-radius:var(--radius-c);padding:12px}

/* ===== Pied de page ===== */
.foot{max-width:680px;margin:0 auto;padding:32px 0 24px;display:flex;flex-direction:column;gap:32px}
.wide .foot{max-width:680px}
.crumbs{display:flex;gap:8px;align-items:center;font-size:12px;line-height:16px;color:var(--text-light);padding-left:28px}
.legal{font-size:11px;line-height:14px;color:var(--text-light);padding:0 28px}
.cookies{font-size:14px;color:var(--text-light)}
.cookies a{color:var(--link);font-weight:600}

/* ===== Modale ===== */
.ov{position:fixed;inset:0;background:rgba(67,69,80,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:var(--radius-b);box-shadow:var(--shadow-1);max-width:520px;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal__hd{display:flex;justify-content:flex-end;padding:4px 32px;box-shadow:0 0 .5px rgba(0,0,0,.3),0 3px 4px rgba(0,0,0,.1);position:relative;z-index:1}
.modal__x{width:32px;height:32px;border:0;background:none;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal__x:hover{background:var(--bg-tertiary)}
.modal__bd{padding:32px;overflow:auto;display:flex;flex-direction:column;gap:32px}
.modal__txt{display:flex;flex-direction:column;gap:16px}
.modal__t{font-size:20px;line-height:26px;font-weight:600}
.modal--wide{max-width:680px}
.modal--center .modal__bd{align-items:center;text-align:center}
.popin{background:#fff;border-radius:var(--radius-b);box-shadow:var(--shadow-1);max-width:400px;width:100%;padding:24px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.popin .inp-wrap{width:100%}
.popin .msg{text-align:left}

/* Toast démo */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;z-index:60}

/* ===== Responsive (maquettes mobiles 402 px) ===== */
@media (max-width:1060px){
  .wide .layout{flex-direction:column;align-items:center}
  .wide .hdr__in{max-width:680px}
  .side{width:680px;max-width:100%}
}
@media (max-width:720px){
  .hdr__in{padding:0 12px}
  .hdr__logo--d{display:none}.hdr__logo--m{display:block}
  .page{padding:24px 4px 0}
  .card{padding:32px 30px}
  .cols-3,.cols-2.stack-m,.choices-hug .choices{grid-template-columns:1fr}
  .choices-hug .rb__label{white-space:normal}
  .tile .rb__box{min-height:94px}
  .inp-wrap,.dd{width:100%}
  .actions{flex-direction:column-reverse;align-items:stretch}
  .actions .btn-primary{width:100%}
  .actions .btn-back{align-self:center}
  .offer{flex-direction:column;text-align:center}
  .middle{flex-direction:column-reverse;align-items:flex-start}
  .onb-wrap{flex-direction:column}
  .onb-illu{display:none}
  .grid2,.alloc,.feat{grid-template-columns:1fr}
  .vals{grid-template-columns:1fr}
  .desktop-only{display:none}
  .mobile-only{display:block}
  .pcards{grid-template-columns:repeat(2,1fr)}
  .kv{grid-template-columns:1fr}
  .kv dt{border-bottom:0;padding-bottom:0}
  .connect{flex-wrap:wrap}
  .foot{padding-left:12px;padding-right:12px}
  .crumbs,.legal{padding:0}
}
</style>
</head>

<script>
/* =========================================================
   Prototype — Parcours prospect « Demande d'adhésion solution épargne »
   Données 100 % fictives, aucun back-end : tout est simulé côté navigateur.
   ========================================================= */

/* --- Réglages de démo (modifiables sans toucher au reste) --- */
const CONFIG = {
  // Codes postaux éligibles : Paris et ses arrondissements (75001 à 75020, + 75116 pour le 16e nord)
  codesPostauxEligibles: [...Array.from({length:20},(_,i)=>'750'+String(i+1).padStart(2,'0')), '75116'],
  dureeChargement: 1800,              // ms des écrans « Calcul de… »
  dureeAnalyseDocument: 1600,         // ms de l'état « Analyse en cours… »
  televersementSimule: true,          // true : « Ajouter » simule un fichier ; false : ouvre le sélecteur de fichiers
};

const A = window.__ASSETS__ || {};
const STEPPER_TITLE = 'Demande d’adhésion solution épargne';

/* ---------- État ---------- */
const S = {
  cur: 'accueil',
  hist: [],
  d: {},           // données saisies
  errs: {},        // erreurs affichées
  modal: null,     // {type, ...}
  ui: {},          // états d'interface (onglets, accordéons…)
};
const d = S.d;

/* ---------- Utilitaires ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nbsp = ' ';
function fmt(n){ n = Math.round(Number(n)||0); const s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, nbsp); return (n<0?'- ':'')+s; }
const eur = n => fmt(n)+nbsp+'€';
const num = v => v===undefined||v===null||v==='' ? null : Number(String(v).replace(/[^\d-]/g,''));
const req = label => `Le champ "${label}" est requis`;
const inval = label => `Le champ "${label}" est invalide`;

function ico(name, size=24, cls='', color=''){
  if(!A[name]) return '';
  const w = Array.isArray(size)?size[0]:size, h = Array.isArray(size)?size[1]:size;
  return `<span class="ico ${cls}" aria-hidden="true" style="width:${w}px;height:${h}px;-webkit-mask-image:url(${A[name]});mask-image:url(${A[name]});${color?`color:${color};`:''}"></span>`;
}
function img(name, w, h, alt='', cls=''){
  if(!A[name]) return '';
  return `<img class="img ${cls}" src="${A[name]}" width="${w}" height="${h}" alt="${esc(alt)}" ${alt?'':'aria-hidden="true"'}>`;
}

/* ---------- Composants ---------- */
function errMsg(k, lg){
  const e = S.errs[k]; if(!e) return '';
  return `<p class="err ${lg?'err--lg':''}" id="err-${k}" role="alert">${img('circleExcl',20,20)}<span>${e}</span></p>`;
}
function info(title, body, extra=''){
  return `<div class="msg msg--info ${extra}">${img('info',24,24)}<div class="msg__body">${title?`<p class="msg__t">${title}</p>`:''}${body?`<div>${body}</div>`:''}</div></div>`;
}
function warnMsg(title, body){
  return `<div class="msg msg--warn">${img('warn',20,20)}<div class="msg__body"><p class="msg__t">${title}</p>${body?`<div class="t-sm">${body}</div>`:''}</div></div>`;

function successMsg(text){

function fieldHead(label, desc, opt, forId){
  const lab = forId ? `<label class="field__label" for="${forId}">${label}</label>` : `<legend class="field__label">${label}</legend>`;

/* Groupe de boutons radio */
function radios({k, label, desc, options, cols=3, tile=false, cls='', disabledOthers=false, opt=false, hideLegend=false}){
  const v = d[k];
  const items = options.map((o,i)=>{
    const id = `${k}-${i}`;
    const checked = v===o.v;
    const dis = disabledOthers && v!==undefined && !checked;
    return `<label class="rb ${tile?'tile '+(o.tileCls||''):''}">
      <input type="radio" name="${k}" id="${id}" value="${esc(o.v)}" ${checked?'checked':''} ${dis?'disabled':''} data-k="${k}">
      <span class="rb__box"><span class="radio"></span>${o.icon?ico(o.icon, tile==='obj'?40:48):''}<span class="rb__label">${o.l}</span></span>
    </label>`;
  }).join('');
  return `<fieldset class="field ${cls}" ${S.errs[k]?`aria-describedby="err-${k}"`:''}>
    ${hideLegend?`<legend class="sr-only">${label}</legend>`:fieldHead(label, desc, opt)}
    <div class="choices cols-${cols}">${items}</div>
    ${errMsg(k)}
  </fieldset>`;
}

/* Champ texte */
function input({k, label, desc, ph='', mode='text', suffix='', clear=true, pre='', full=false, cal=false, maxlength='', autocomplete='off', opt=false, extraErr=''}){
  const v = d[k] ?? '';
  const id = 'f-'+k;
  const hasErr = !!S.errs[k];
  const shown = suffix && v!=='' ? fmt(v) : v;
  const sufPos = '';
  return `<div class="field">
    ${label?fieldHead(label, desc, opt, id):''}
    <div class="field__grp">
      <div class="inp-wrap ${full?'full':''} ${cal?'has-cal':''}">
        ${pre?`<span class="inp-pre">${ico(pre,18,'','#757980')}</span>`:''}
        <input class="inp ${pre?'inp--icon-l':''}" id="${id}" data-k="${k}" data-mode="${mode}" ${suffix?'data-money="1"':''} value="${esc(shown)}" placeholder="${esc(ph)}"
          ${mode==='num'||mode==='money'?'inputmode="numeric"':''} ${mode==='email'?'type="email" inputmode="email"':'type="text"'} ${mode==='tel'?'inputmode="tel"':''}
          ${maxlength?`maxlength="${maxlength}"`:''} autocomplete="${autocomplete}" ${hasErr?`aria-invalid="true" aria-describedby="err-${k}"`:''}>
        ${suffix?`<span class="inp-suffix" ${sufPos} data-suffix="${k}">${suffix}</span>`:''}
        ${clear?`<button type="button" class="inp-clear" data-clear="${k}" aria-label="Effacer ${esc(label||'')}" ${v===''?'hidden':''}>${ico('cross',22)}</button>`:''}
        ${cal?`<span class="inp-cal">${ico('calendar',22)}</span>`:''}
      </div>
      ${errMsg(k)}${extraErr}
    </div>
  </div>`;
}

/* --- Calcul fictif de la projection --- */
const SCENARIOS = [
  {k:'prudent', l:'Prudent', r:.025, risk:'2/7', eur:40, uc:60, desc:'Valorisation peu importante mais régulière des placements, avec un risque de perte en capital limité.'},
  {k:'equilibre', l:'Equilibré', r:.032, risk:'3/7', eur:20, uc:80, desc:'Prise de risque modérée, avec pour objectif une performance moyenne, sur toute la durée du placement.'},
  {k:'dynamique', l:'Dynamique', r:.037, risk:'3/7', eur:0, uc:100, desc:'Performance très élevée avec en contrepartie, un risque de perte en capital très important.'},
];
const pctLbl = r => (r*100).toFixed(1).replace('.',',')+nbsp+'%';
function projYears(){
  if(isPER()) return Math.max(1,(num(d.ageRetraite)||64)-(num(d.age)||30));
  return {'2-4':3,'5-7':6,'8+':10}[d.horizon]||10;
}
function projCalc(r){
  const y = projYears(), init = num(d.vInit)||0, m = num(d.vProg)||0;
  const invest = init + m*12*y;
  const rm = r/12, n = 12*y;
  const cap = init*Math.pow(1+r,y) + (m? m*((Math.pow(1+rm,n)-1)/rm) : 0);
  return {y, invest, cap, gain:cap-invest, rente: cap/386.7};
}

function parseDate(s){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s||''); if(!m) return null;
  const dd=+m[1], mm=+m[2], yy=+m[3]; const dt = new Date(yy,mm-1,dd);
  if(dt.getFullYear()!==yy||dt.getMonth()!==mm-1||dt.getDate()!==dd) return null;
  if(yy<1900||dt>new Date()) return null; return dt;
}
function ageFrom(dt){ const n=new Date(); let a=n.getFullYear()-dt.getFullYear(); const m=n.getMonth()-dt.getMonth(); if(m<0||(m===0&&n.getDate()<dt.getDate())) a--; return a; }

function scoring(){
  let k = 0;
  if(d.q1===QS.q1.ok) k++; if(d.q2===QS.q2.ok) k++; if(d.q3===QS.q3.ok) k++;
  if(d.q4 && d.q4!=='Je n’ai jamais investi') k++; if(d.q5==='oui') k++;
  const conn = k<=1?'Novice':k<=3?'Informé(e)':'Averti(e)';
  const t = (3-QS.q6.o.indexOf(d.q6)-1) + (3-QS.q7.o.indexOf(d.q7)-1);
  const tol = t<=1?'Faible':t===2?'Moyenne':'Élevée';
  const dur = d.q8?.startsWith('Oui')?'Engagé(e)':d.q8==='Je ne sais pas'?'Sensibilisé(e)':'Neutre';
  let prof = tol==='Faible'?'Sérénité':tol==='Moyenne'?(conn==='Novice'?'Prudent':'Equilibré'):(conn==='Averti(e)'?'Offensif':'Dynamique');
  if(isPER()) prof = {'Sérénité':'Prudent','Offensif':'Dynamique'}[prof]||prof;
  return {conn, tol, dur, prof};
}

function uploadBox({k, title, desc}){
  const st = S.ui['up_'+k] || {};
  const files = d[k+'Files']||[];
  let inner='', btn='';
  if(st.loading){ btn=`<button type="button" class="btn btn-tertiary" data-act="upCancel" data-up="${k}">Annuler</button>`; inner=`<div class="stack-8" role="status"><p class="t-sm" style="color:#1a8fd2">Analyse en cours...</p><div class="prog"><span id="prog-${k}"></span></div></div>`; }
  else if(files.length){ inner = files.map((f,i)=>`<div class="file">${img('fileLines',24,24)}<span class="file__n">${esc(f.n)}</span><span class="file__s">${f.s}</span><button type="button" class="inp-clear" style="position:static;transform:none" data-act="upDel" data-up="${k}" data-i="${i}" aria-label="Supprimer ${esc(f.n)}">${ico('cross',22)}</button></div>`).join(''); }
  else { btn=`<button type="button" class="btn btn-tertiary" data-act="upAdd" data-up="${k}">Ajouter</button>`; }
  const err = st.err===1?`<p class="err err--lg" role="alert">${img('circleExclOutline',20,20)}<span>Votre document est invalide. Vérifiez qu’il respecte les consignes, puis réessayez.</span></p>`
            : st.err===2?`<p class="err err--lg" role="alert">${img('circleExclOutline',20,20)}<span>Votre document est invalide. <u>Contactez un conseiller</u> qui vous accompagnera pour finaliser votre demande.</span></p>`:'';
  return `<div class="stack-12"><div class="upl"><div class="upl__head"><div><p class="upl__t">${title}</p><p class="upl__d">${desc}</p></div>${btn}</div>${inner}${err}</div>${errMsg(k, true)}
    <input type="file" hidden id="file-${k}" data-file="${k}" accept=".jpg,.jpeg,.png,.pdf,image/*,application/pdf" ${k==='pi'?'multiple':''}></div>`;
}
function startUpload(k, list){
  const st = S.ui['up_'+k] = S.ui['up_'+k]||{};
  delete S.errs[k];
  const bad = list.some(f=>!/\.(jpe?g|png|pdf|heic|webp)$/i.test(f.n) || f.bytes>6*1024*1024);
  st.loading=true; st.err=0; render();
  requestAnimationFrame(()=>{ const p=document.getElementById('prog-'+k); if(p) p.style.width='100%'; });
  st.timer = setTimeout(()=>{
    st.loading=false;
    if(bad){ st.fails=(st.fails||0)+1; if(st.fails>=3){ st.err=2; openModal('upload'); } else st.err = st.fails>=2?2:1; }
    else { st.err=0; d[k+'Files']=list.map(f=>({n:f.n, s:f.s})); onUploaded(k); }
    render();
  }, CONFIG.dureeAnalyseDocument);
}

  if(k==='pi'){ d.nomNaissance ??= (d.nom||'').toUpperCase()||'DUPONT'; d.paysNaissance ??= 'FRANCE'; d.villeNaissance ??= 'BORDEAUX'; d.nationalite ??= 'FRANCAISE'; }

      ${checkbox({k:'autorisation', label:'J’autorise le prélèvement automatique des sommes dues sur mon compte bancaire, conformément aux conditions convenues.'})}`;
  },

  next(){

    if(!d.prelev){ S.errs.prelev=req('À quelle date souhaitez-vous effectuer votre prélèvement ?')+'.'; ok=false; }

  }

/* ================= Moteur : rendu, navigation, événements ================= */
const LEGAL = 'Les informations vous concernant, nécessaires au traitement de votre souscription, sont traitées par Groupama Gan Vie (responsable de traitement), afin de permettre la souscription d’un contrat d’assurance, ainsi que la gestion de la relation commerciale. Les données sont destinées aux services habilités de Groupama Gan Vie et, le cas échéant, à ses  sous-traitants. Concernant vos données personnelles, vous pouvez consulter notre politique de protection des données et retrouver les informations relatives aux traitements mis en œuvre et aux modalités d’exercice de vos droits à l’adresse Protection de vos données personnelles. (lien sur la partie en gras: Protection de vos données personnelles)';

function screenTitle(scr){ const t = scr.title; return typeof t==='function'?t():t; }

function render(){
  const scr = SCREENS[S.cur];
  const app = document.getElementById('app');
  // mémorise le focus pour le restaurer après re-rendu
  const ae = document.activeElement;
  const keep = ae && ae.id && app.contains(ae) ? {id:ae.id, s:ae.selectionStart, e:ae.selectionEnd} : null;

  document.body.classList.toggle('wide', !!scr.wide);
  const title = screenTitle(scr);
  const isLoader = !!scr.auto;
  const card = `<main class="card" id="main">
      <div class="stack">
        ${scr.noStepper?'':stepper()}
        ${title?`<h1 class="h2" tabindex="-1" data-title>${title}</h1>`:''}
        ${scr.render()}
        ${isLoader||scr.noActions?'':actions({back:!scr.noBack && S.hist.length>0, cta:scr.cta||'Continuer'})}
      </div></main>`;
  app.innerHTML = `
    <header class="hdr"><div class="hdr__in">
      <img class="hdr__logo hdr__logo--d" src="${A.logo}" width="163" height="56" alt="Groupama">
      <img class="hdr__logo hdr__logo--m" src="${A.logoMark}" width="38" height="56" alt="Groupama">
      <button type="button" class="btn-help" data-act="help">${img('headerPhone',18,18)}Besoin d’aide ?</button>
    </div></header>
    <div class="page"><div class="layout">${card}${scr.side?scr.side():''}</div></div>
    <footer class="foot">
      <nav aria-label="Fil d’Ariane" class="crumbs"><span>Lien</span>${ico('chevronRightSm',12)}<span>Lien</span>${ico('chevronRightSm',12)}<span>Lien</span></nav>
      ${scr.legal?`<p class="legal">${LEGAL}</p>`:''}
      <p class="cookies"><a href="#" data-act="noop">Gérer mes cookies</a> - v1.6.2</p>
    </footer>`;

  placeSuffixes();
  if(S.focusTitle){ S.focusTitle=false; (app.querySelector('[data-title]')||app.querySelector('h1'))?.focus({preventScroll:true}); }
  else if(S.focusErr){ S.focusErr=false; const f = app.querySelector('[aria-invalid=true], .err'); const el = f?.closest('.field,.stack-8,.stack-12')?.querySelector('input:not([type=hidden]),button.dd__btn') || f; el?.focus(); el?.scrollIntoView({block:'center'}); }
  else if(keep){ const el=document.getElementById(keep.id); if(el){ el.focus({preventScroll:true}); try{ if(keep.s!=null) el.setSelectionRange(keep.s,keep.e); }catch(e){} } }
}

function go(next){
  if(!next) return;
  let target = next;
  if(typeof next==='object'){ target = next.go; while(S.hist.length && S.hist[S.hist.length-1]!==target) S.hist.pop(); S.hist.pop(); }
  else if(!SCREENS[S.cur].auto) S.hist.push(S.cur);
  S.cur = target; S.errs = {}; S.ui.dd = null; S.focusTitle = true;
  render(); window.scrollTo(0,0);
  const scr = SCREENS[S.cur];
  if(scr.auto){ clearTimeout(S.autoT); S.autoT = setTimeout(()=>{ if(S.cur===target){ S.cur = scr.auto(); S.focusTitle=true; render(); } }, CONFIG.dureeChargement); }
}
function back(){
  if(!S.hist.length) return;
  clearTimeout(S.autoT);
  S.cur = S.hist.pop(); S.errs = {}; S.ui.dd=null; S.ui.editV=false; S.focusTitle=true;
  render(); window.scrollTo(0,0);
}
function next(){
  const scr = SCREENS[S.cur];
  S.errs = {};
  const r = scr.next ? scr.next() : null;
  if(r) go(r);
  else { if(!S.modal) S.focusErr = true; render(); }
}

/* ----- Formatage des saisies ----- */
function formatInput(el){
  const mode = el.dataset.mode; const raw = el.value; const pos = el.selectionStart ?? raw.length;
  let v = raw;
  if(mode==='num'){ v = raw.replace(/\D/g,''); }
  else if(mode==='money'){ const dg = raw.replace(/\D/g,'').replace(/^0+(?=\d)/,''); v = dg?fmt(+dg):''; }
  else if(mode==='date'){ const dg=raw.replace(/\D/g,'').slice(0,8); v = dg.length>4?`${dg.slice(0,2)}/${dg.slice(2,4)}/${dg.slice(4)}`:dg.length>2?`${dg.slice(0,2)}/${dg.slice(2)}`:dg; }
  else if(mode==='tel'){ v = raw.replace(/\D/g,'').slice(0,10).replace(/(\d{2})(?=\d)/g,'$1 '); }
  if(raw!==v){
    // replace le curseur après le même nombre de chiffres
    const digitsBefore = raw.slice(0,pos).replace(/\D/g,'').length; let i=0, c=0;
    while(i<v.length && c<digitsBefore){ if(/\d/.test(v[i])) c++; i++; }
    el.value=v; try{ el.setSelectionRange(i,i);}catch(e){}
  }
  return mode==='money' ? v.replace(/\D/g,'') : v;
}
const _cv = document.createElement('canvas').getContext('2d');
function textW(t){ _cv.font = '600 16px '+getComputedStyle(document.body).fontFamily; return _cv.measureText(t).width; }
function sufPos(el){ const s = el.parentElement.querySelector('.inp-suffix'); if(s){ s.style.left = (15 + textW(el.value||'0') + 5)+'px'; s.style.color = el.value?'var(--text)':'var(--text)'; } }
function placeSuffixes(){ document.querySelectorAll('input[data-money]').forEach(sufPos); }

/* ----- Événements ----- */
document.addEventListener('click', e=>{
  const t = e.target;
  // liste déroulante : clic extérieur
  if(S.ui.dd && !t.closest('[data-dd]')){ S.ui.dd=null; render(); }
  const opt = t.closest('[data-ddopt]');
  if(opt){ const k=opt.dataset.ddopt; d[k]=opt.dataset.v; delete S.errs[k]; S.ui.dd=null; render(); document.getElementById('dd-'+k)?.focus(); return; }
  const ddb = t.closest('[data-ddbtn]');
  if(ddb){ const k=ddb.dataset.ddbtn; S.ui.dd = S.ui.dd===k?null:k; S.ui.ddActive=-1; render(); return; }
  const cl = t.closest('[data-clear]');
  if(cl){ const k=cl.dataset.clear; d[k]=''; S.errs[k] && delete S.errs[k]; if(k==='cp'){ S.ui.cpNonEligible=false; renderModal(); } else render(); document.getElementById('f-'+k)?.focus(); return; }
  const tab = t.closest('[data-tab]');
  if(tab){ S.ui[tab.dataset.tab]=+tab.dataset.i; if(tab.dataset.tab==='fiscTab') renderModal(); else render(); document.querySelector(`[data-tab="${tab.dataset.tab}"][aria-selected=true]`)?.focus(); return; }
  const acc = t.closest('[data-acc]');
  if(acc){ const id=acc.dataset.acc; S.ui.acc[id]=!S.ui.acc[id]; render(); return; }
  if(t.closest('[data-ov]') && t.matches('.ov') && S.modal && S.modal.type!=='cp'){ closeModal(); return; }
  const a = t.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act;
  if(a.getAttribute('aria-disabled')==='true') return;
  switch(act){
    case 'next': next(); break;
    case 'back': back(); break;
    case 'close': { const isCta = a.classList.contains('btn-primary'); closeModal(); if(isCta) toast('Simulation : demande de rappel envoyée'); break; }
    case 'cp': validateCP(); break;
    case 'modif': go('modifType'); break;
    case 'fiscal': S.ui.fiscTab=0; openModal('fiscal'); break;
    case 'professions': openModal('professions'); break;
    case 'rappel': toast('Simulation : demande de rappel envoyée'); break;
    case 'dl': toast('Simulation : document téléchargé'); break;
    case 'help': toast('Simulation : aide et contact'); break;
    case 'connect': toast('Non simulé : parcours client hors périmètre du prototype'); break;
    case 'adresseNR': toast('Non simulé dans ce prototype'); break;
    case 'noop': e.preventDefault(); break;
    case 'editV': S.ui.editV=true; d.eInit=d.vInit; d.eProg=d.vProg; render(); document.getElementById('f-eInit')?.focus(); break;
    case 'cancelV': S.ui.editV=false; delete S.errs.editV; render(); break;
    case 'saveV': {
      const vi=num(d.eInit), vp=num(d.eProg); let ok=true; delete S.errs.eInit; delete S.errs.eProg; delete S.errs.editV;
      if(vi===null){ S.errs.eInit=req('Versement initial'); ok=false; } else if(vi<300||vi>149999){ S.errs.eInit=inval('Versement initial'); ok=false; }
      if(vp!==null && vp!==0 && (vp<30||vp>2000)){ S.errs.eProg=inval('Versement programmé'); ok=false; }
      if(ok){ d.vInit=d.eInit; d.vProg=d.eProg; S.ui.editV=false; }
      render(); break; }
    case 'upAdd': {
      const k=a.dataset.up;
      if(CONFIG.televersementSimule){
        const list = k==='pi'?[{n:'recto-cni.pdf',s:'567 Ko',bytes:580000},{n:'verso-cni.pdf',s:'512 Ko',bytes:524000}]:[{n:'RIB.pdf',s:'567 Ko',bytes:580000}];
        startUpload(k,list);
      } else document.getElementById('file-'+k)?.click();
      break; }
    case 'upCancel': { const st=S.ui['up_'+a.dataset.up]; clearTimeout(st.timer); st.loading=false; render(); break; }
    case 'upDel': { const k=a.dataset.up; d[k+'Files'].splice(+a.dataset.i,1); render(); break; }
    case 'restart': location.reload(); break;
  }
});

document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.file){ const k=t.dataset.file; const list=[...t.files].map(f=>({n:f.name,s:sizeLbl(f.size),bytes:f.size})); t.value=''; if(list.length) startUpload(k,list); return; }
  if(t.dataset.sel==='scen'){ S.ui.scen=+t.value; render(); return; }
  if(!t.dataset.k) return;
  if(t.type==='radio'||t.type==='checkbox'){
    const k=t.dataset.k; d[k] = t.type==='checkbox'?t.checked:t.value; delete S.errs[k];
    SCREENS[S.cur].onChange?.(k);
    if(S.modal) renderModal(); else render();
  }
});

document.addEventListener('input', e=>{
  const t=e.target; if(!t.dataset.k || t.type==='radio'||t.type==='checkbox') return;
  const k=t.dataset.k; const v=formatInput(t);
  d[k] = v;
  if(t.dataset.money) sufPos(t);
  const clr = t.parentElement.querySelector('[data-clear]'); if(clr) clr.hidden = v==='';
  if(S.errs[k]){ delete S.errs[k]; t.removeAttribute('aria-invalid'); const er=document.getElementById('err-'+k); er?.remove(); document.getElementById('errbox-'+k)?.remove(); }
  if(k==='cp' && S.ui.cpNonEligible){ S.ui.cpNonEligible=false; renderModal(); document.getElementById('f-cp')?.focus(); return; }
  SCREENS[S.cur].live?.(k);
  if(k==='naissance' && (v.length===10 || (v.length===9 && d._dLen===10))) render();
  d._dLen = k==='naissance'?v.length:d._dLen;
});
document.addEventListener('keydown', e=>{
  // Modale : Échap + piège du focus
  if(S.modal){
    if(e.key==='Escape' && S.modal.type!=='cp'){ closeModal(); return; }
    if(e.key==='Tab'){ const f=[...document.querySelectorAll('#modal-root button:not([hidden]), #modal-root input, #modal-root [tabindex="0"]')].filter(x=>!x.disabled); if(!f.length) return; const i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){ f[f.length-1].focus(); e.preventDefault(); } else if(!e.shiftKey&&i===f.length-1){ f[0].focus(); e.preventDefault(); } }
    if(e.key==='Enter' && e.target.id==='f-cp'){ validateCP(); e.preventDefault(); }
  }
  // Onglets : flèches gauche/droite
  const tab = e.target.closest?.('[data-tab]');
  if(tab && (e.key==='ArrowRight'||e.key==='ArrowLeft')){ const g=tab.dataset.tab; const all=[...document.querySelectorAll(`[data-tab="${g}"]`)]; let i=all.indexOf(tab)+(e.key==='ArrowRight'?1:-1); i=(i+all.length)%all.length; all[i].click(); e.preventDefault(); }
  // Liste déroulante au clavier
  const ddb = e.target.closest?.('[data-ddbtn]');
  if(ddb){
    const k=ddb.dataset.ddbtn; const opts=[...document.querySelectorAll(`[data-ddopt="${k}"]`)];
    if(['ArrowDown','ArrowUp'].includes(e.key)){
      e.preventDefault();
      if(S.ui.dd!==k){ S.ui.dd=k; S.ui.ddActive=-1; render(); }
      const n = document.querySelectorAll(`[data-ddopt="${k}"]`).length;
      S.ui.ddActive = Math.max(0, Math.min(n-1, (S.ui.ddActive??-1)+(e.key==='ArrowDown'?1:-1)));
      render(); const b=document.getElementById('dd-'+k); const o=document.getElementById(`dd-${k}-o${S.ui.ddActive}`); b?.setAttribute('aria-activedescendant', o?.id||''); o?.scrollIntoView({block:'nearest'});
    } else if((e.key==='Enter'||e.key===' ') && S.ui.dd===k && S.ui.ddActive>=0){ e.preventDefault(); opts[S.ui.ddActive]?.click(); }
    else if(e.key==='Escape' && S.ui.dd===k){ S.ui.dd=null; render(); }
  }
});

function validateCP(){
  const v=(d.cp||'').trim(); delete S.errs.cp; S.ui.cpNonEligible=false;
  if(!v) S.errs.cp = 'Le champ "code postal" est requis';
  else if(!/^\d{5}$/.test(v)) S.errs.cp = 'Le champ "code postal" est invalide';
  else if(!CONFIG.codesPostauxEligibles.includes(v)) S.ui.cpNonEligible=true;
  else { closeModal(); document.querySelector('[data-title]')?.focus(); return; }
  renderModal();
}

/* ----- Démarrage ----- */
render();
openModal('cp');
document.fonts?.ready.then(placeSuffixes);
